<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;
        }

        div.item {
            background-color: lightskyblue;
            border: px solid black;
            text-align: center;
            flex-basis: 300px         
        }

        div#box1 {
            flex-grow: 2;
            flex-shrink: 0;
        }

        div#box2 {
            flex-grow: 4;
            flex-shrink: 0;
        }

        div#box3 {
            flex-grow: 7;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="box1">A</div>
        <div class="item" id="box2">B</div>
        <div class="item" id="box3">C</div>
    </div>
    
</body>
</html>
